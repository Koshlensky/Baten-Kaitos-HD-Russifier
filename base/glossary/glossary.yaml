# Единый глоссарий Baten Kaitos I & II HD (v2.0).
#
# Правила:
# - Одна запись на понятие. games: shared | bk1 | bk2.
# - Статусы: approved — утверждено владельцем (поле ru, проверяется QA); proposed — рабочий вариант
#   по принципам D-001 (поле ru_proposed с обоснованием), утверждение — после согласования;
#   disputed — вариантов несколько, рекомендация есть, но выбор за владельцем (disputes.md);
#   candidate — найдено, вариантов ещё нет.
# - ru заполняется только при status: approved. Пакеты переводчика получают и proposed-варианты.
# - approval: preliminary — принято предварительно (D-025, D-021), окончательно — по итогам пилота.
# - verification — проверка по источникам (для названий-звёзд, D-021): звезда, название МАС,
#   найденные русские формы, источники с датой доступа.
# - forms — склонение утверждённого варианта (им, род, дат, вин, твор, пр; мн при необходимости);
#   allowed — допустимые формы для QA, forbidden — запрещённые варианты; indecl: true — не склоняется.
# - sources — ID строк игры, где термин встречается, и японское написание.
#
# Принципы (docs/DECISIONS.md):
# - D-001: имена — по английскому написанию; японское произношение уточняет чтение, если английское
#   написание читается по-разному. Спорное согласуется с владельцем.
# - D-009: magnus — «магнус», мн. «магнусы».
# - D-011: технические коды (FLAG_…, BBG_CBL, категория internal) не переводятся.
# - D-012: титры (категория credits) — имена как в оригинале, должности переводятся, где возможно.
# - D-013: названия композиций (категория music_title, группа MSC) остаются на английском.
# - Названия мест по звёздам (Mira, Mintaka, Alfard…) — предложение: устоявшиеся русские
#   астрономические названия (disputes.md#star-names); до решения — status: proposed.
#
# Категории: character, location, organization, magnus, item, equipment, ability, enemy, mechanic, story, ui.
# Кандидаты для пополнения: candidates_terms.csv, candidates_names.csv, candidates_locations.csv, candidates_magnus.csv.

