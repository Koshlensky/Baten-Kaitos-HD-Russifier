translation_notes:
  - "D-002: обращения к духу — без форм рода: «Тебя что-то беспокоит?», «<n0>, что скажешь?»; не «Ты устал?», «Ты готова?»."
  - "О духе в третьем лице (EV_0035, EV_0037) — без местоимения и без лишних подстановок (<n0> только там, где он есть в оригинале): «Есть ещё кое-кто. <n0>. Живёт у меня в сердце», «Голос слышу только я, но там точно кто-то есть»."
  - "D-003: варианты _0/_1 переводятся оба; если по-русски реплика нейтральна, тексты вариантов совпадают («Ничего.»), если нет — _0 женский, _1 мужской род («Встречала.» / «Встречал.»)."
  - "Тег <n0> сохраняется; русское окружение не должно требовать падежа имени (имя вводит игрок)."
