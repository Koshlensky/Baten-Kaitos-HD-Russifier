translation_notes:
  - "D-005: до SCR_GEM02_8_4461 — ни прошедшего времени от первого/третьего лица о Mizuti, ни согласованных прилагательных, ни местоимений «он/она». Ломаная речь помогает: настоящее время и инфинитив не требуют рода (схема: «[титул и имя] устать!»), но прилагательное в титуле род требует — поэтому титул решается отдельно."
  - "Титул «the Great Mizuti» — спорный: варианты и их влияние на род — disputes.md#mizuti-title."
  - "Описания магнусов с «her» (MGI_1064, MGI_1070, MGI_0958) можно увидеть раньше сцены в Gemma: по D-005 русский не должен раскрывать пол раньше английского — английский здесь уже раскрывает; решение — в disputes.md#mizuti-title."
