translation_notes:
  - "D-004: предварительно мужской род. Аргументы за: архаичная «стариковская» речь в японском (маркер), мужской голос среди двух, отсутствие возражений в тексте. Против или осторожно: пол у куклы отсутствует, английский сознательно избегает местоимений, второй голос женский."
  - "Существительное «кукла» женского рода — согласуем с референтом, а не со словом: «[имя] сказал», но «эта кукла» в устах Verus допустима как обезличивание."
  - "Речь — архаичная, но понятная: «негодница», «изволь», «полно тебе», без церковнославянизмов."
